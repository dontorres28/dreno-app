<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreno</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" href="/icon-180.svg" />

    <!-- PWA manifest (Android + Chrome "Add to home screen") -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone app chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dreno" />

    <!-- Theme color for Android Chrome address bar -->
    <meta name="theme-color" content="#F7F5F1" />

    <!-- Set theme before paint to avoid FOUC. Default: light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dreno-theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
